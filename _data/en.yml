# ---------------- JOIN US ----------------
# Paste the KoboToolbox or Google Form link in "apply_url".
join:
  intro: "[Under Construction!] Two or three sentences on why people join CDMD."
  openings_title: "Current Openings"
  jobs:
    - title: "Enumerator Roster"
      location: "Various provinces"
      deadline: "Open continuously"
      apply_url: ""          # e.g. https://ee.kobotoolbox.org/x/XXXX
      details: |
        CDMD is building a roster of enumerators for upcoming surveys across Cambodia. Registration is not a job offer. Registered candidates will be contacted when positions become available.

        #### Main tasks
        - Conduct face-to-face interviews with households and individuals
        - Record data accurately on tablets or smartphones
        - Follow ethical and data protection procedures

        #### Requirements
        - Fluency in Khmer
        - Completed secondary or university education
        - Comfortable using tablets or smartphones
        - Willing to travel to different provinces
        - Experience working with persons with disabilities is an advantage

        #### How to apply
        Click "Apply" and complete the registration form.
  contact_title: "Contact Us"
  contact_text: "For partnership opportunities or general inquiries, please write to us or use the form."
  contact_form_url: ""       # Google Form embed link (ends with ?embedded=true)
