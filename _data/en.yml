# ---------------- ABOUT US ----------------
about:
  guides_title: "What Guides Us"
  vision_label: "Our Vision"
  vision: "A Cambodia where persons with disabilities learn, work, and live with dignity."
  mission_label: "Our Mission"
  mission: "CDMD supports persons with disabilities and their families in Cambodia. We open pathways to education, decent work, and secure livelihoods. We work hand in hand with government and community partners, and we use evidence to improve what we do."
  values_label: "Our Values"
  values:
    - icon: dignity
      name: "Dignity"
      text: "We see persons with disabilities as active members of society, not as recipients of charity."
    - icon: participation
      name: "Participation"
      text: "We involve persons with disabilities and their families in designing and implementing our work."
    - icon: evidence
      name: "Evidence"
      text: "We measure our results honestly and learn from them, so that resources go to what works."
    - icon: partnership
      name: "Partnership"
      text: "We work with government, schools, and communities to strengthen existing systems."
    - icon: integrity
      name: "Integrity"
      text: "We manage funds transparently and protect the privacy and safety of the people we serve."
